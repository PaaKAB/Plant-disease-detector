<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>

    <style>
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #eafaf1;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        label {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background-color: #27ae60; /* Green color */
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        label:hover {
            background-color: #2ecc71; /* Lighter green */
        }

        .file-description {
            margin-top: 10px;
            font-size: 1rem;
            color: #2c3e50;
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 1.1rem;
            color: white;
            background-color: #27ae60; /* Green */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2ecc71;
        }

        h2 {
            margin-top: 30px;
            color: #2c3e50;
            font-size: 1.8rem;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

    
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            form {
                padding: 15px;
            }

            label, button {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>Upload a Plant Image</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="imageInput">Choose File</label> 
        <input type="file" id="imageInput" name="image" accept="image/*">
        <div class="file-description">Select a file from your computer to upload</div> 
        <button type="submit">Upload</button>
    </form>

    <h2>Image Preview:</h2>
    <img id="imagePreview" src="" alt="Image Preview" width="300px" style="display:none;">

    <script>
        document.getElementById('imageInput').onchange = function(event) {
            const imagePreview = document.getElementById('imagePreview');
            const file = event.target.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block'; 
                };
                reader.readAsDataURL(file); 
            }
        };
    </script>
</body>
</html>
